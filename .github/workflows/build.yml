name: Build deb
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos Automatically
        run: |
          sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev make perl git curl unzip
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos.sh)"
      - name: Build rootless
        run: make package FINALPACKAGE=1 THEOS=~/theos THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: ZepLaoModMilanVu-rootless
          path: packages/*.deb
